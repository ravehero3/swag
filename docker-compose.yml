services:
  app:
    image: ${DOCKER_IMAGE}
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Persistent image gallery — survives redeployments
      - ./data/kit-artworks:/app/public/kit-artworks
      # Persistent uploads (hero logo, videos, etc.)
      - ./data/uploads:/app/public/uploads
      # Persistent beat files — CRITICAL: must survive container restarts
      # This bind mount OVERRIDES the VOLUME declaration in the Dockerfile,
      # ensuring beats stored at /app/public/uploads/beats survive redeploys.
      - ./data/uploads/beats:/app/public/uploads/beats
